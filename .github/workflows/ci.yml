# Production-grade CI for TruthBounty Frontend
# Supports fast feedback, stable PR validation, and open-source contributions

name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  artifacts:
    name: Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Verify contract release artifacts (drift fails here)
        run: node scripts/verify-artifacts.mjs

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Detect package manager
        id: pkg
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "manager=pnpm" >> $GITHUB_OUTPUT
          elif [ -f yarn.lock ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
          else
            echo "manager=npm" >> $GITHUB_OUTPUT
          fi
      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            ~/.pnpm-store
          key: ${{ runner.os }}-${{ steps.pkg.outputs.manager }}-${{ hashFiles('**/package-lock.json', '**/pnpm-lock.yaml', '**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ steps.pkg.outputs.manager }}-
      - name: Install dependencies
        run: |
          if [ "${{ steps.pkg.outputs.manager }}" = "pnpm" ]; then
            corepack enable pnpm && pnpm install --frozen-lockfile
          elif [ "${{ steps.pkg.outputs.manager }}" = "yarn" ]; then
            corepack enable yarn && yarn install --frozen-lockfile
          else
            npm ci
          fi
      - name: Run linter
        run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Detect package manager
        id: pkg
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "manager=pnpm" >> $GITHUB_OUTPUT
          elif [ -f yarn.lock ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
          else
            echo "manager=npm" >> $GITHUB_OUTPUT
          fi
      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            ~/.pnpm-store
          key: ${{ runner.os }}-${{ steps.pkg.outputs.manager }}-${{ hashFiles('**/package-lock.json', '**/pnpm-lock.yaml', '**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ steps.pkg.outputs.manager }}-
      - name: Install dependencies
        run: |
          if [ "${{ steps.pkg.outputs.manager }}" = "pnpm" ]; then
            corepack enable pnpm && pnpm install --frozen-lockfile
          elif [ "${{ steps.pkg.outputs.manager }}" = "yarn" ]; then
            corepack enable yarn && yarn install --frozen-lockfile
          else
            npm ci
          fi
      - name: Run tests
        run: npm run test

  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      # Public placeholder so the production build/prerender can run without
      # third-party WalletConnect credentials in CI. Real deployments must set
      # a genuine NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID.
      NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ci-placeholder-project-id
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Detect package manager
        id: pkg
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "manager=pnpm" >> $GITHUB_OUTPUT
          elif [ -f yarn.lock ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
          else
            echo "manager=npm" >> $GITHUB_OUTPUT
          fi
      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            ~/.pnpm-store
          key: ${{ runner.os }}-${{ steps.pkg.outputs.manager }}-${{ hashFiles('**/package-lock.json', '**/pnpm-lock.yaml', '**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ steps.pkg.outputs.manager }}-
      - name: Install dependencies
        run: |
          if [ "${{ steps.pkg.outputs.manager }}" = "pnpm" ]; then
            corepack enable pnpm && pnpm install --frozen-lockfile
          elif [ "${{ steps.pkg.outputs.manager }}" = "yarn" ]; then
            corepack enable yarn && yarn install --frozen-lockfile
          else
            npm ci
          fi
      - name: Verify contract release artifacts
        run: npm run verify-artifacts
      - name: Type check
        run: npm run type-check
      - name: Build app
        run: npm run build


  accessibility:
    name: Accessibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Enable pnpm
        run: corepack enable pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run accessibility tests
        run: pnpm test:a11y

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    env:
      # Public placeholder (see the Build job) so Playwright can build and boot
      # the production app without WalletConnect credentials.
      NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ci-placeholder-project-id
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Detect package manager
        id: pkg
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "manager=pnpm" >> $GITHUB_OUTPUT
          elif [ -f yarn.lock ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
          else
            echo "manager=npm" >> $GITHUB_OUTPUT
          fi
      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            ~/.pnpm-store
          key: ${{ runner.os }}-${{ steps.pkg.outputs.manager }}-${{ hashFiles('**/package-lock.json', '**/pnpm-lock.yaml', '**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ steps.pkg.outputs.manager }}-
      - name: Install dependencies
        run: |
          if [ "${{ steps.pkg.outputs.manager }}" = "pnpm" ]; then
            corepack enable pnpm && pnpm install --frozen-lockfile
          elif [ "${{ steps.pkg.outputs.manager }}" = "yarn" ]; then
            corepack enable yarn && yarn install --frozen-lockfile
          else
            npm ci
          fi
      - name: Build application for Playwright
        run: npm run build
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright E2E tests
        run: npm run test:e2e
